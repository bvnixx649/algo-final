<title>Algo Final 254383</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Brilliant-style. Chapter cover (solid cobalt hero + card list) -> one-idea card player; quiz = one question per screen with a feedback sheet. One accent, used heavily. */
:root {
  --bg: #FAFAF9; --surface: #F0F0EE; --surface-2: #E6E6E3; --ink: #17171B; --muted: #686872; --line: rgba(23,23,27,.10);
  --accent: #2F5BEA; --accent-press: #2549C4; --on-accent: #FFFFFF; --panel: #EBF0FE; --panel-ink: #1D3A9E; --accent-soft: rgba(47,91,234,.14);
  --good: #17804E; --good-soft: #DDF3E6; --bad: #C2331D; --bad-soft: #FCE6E1;
  --font: "Prompt", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --ease: cubic-bezier(.23,1,.32,1); --ease-io: cubic-bezier(.77,0,.175,1); --drawer: cubic-bezier(.32,.72,0,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101013; --surface: #1A1A1F; --surface-2: #25252B; --ink: #EDEDF0; --muted: #9D9DA8; --line: rgba(255,255,255,.09);
  --accent: #5E7BFF; --accent-press: #4C69EE; --on-accent: #FFFFFF; --panel: #171C33; --panel-ink: #A9B9FF; --accent-soft: rgba(94,123,255,.18);
  --good: #56C98B; --good-soft: rgba(86,201,139,.14); --bad: #F2846F; --bad-soft: rgba(242,132,111,.14); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101013; --surface: #1A1A1F; --surface-2: #25252B; --ink: #EDEDF0; --muted: #9D9DA8; --line: rgba(255,255,255,.09);
  --accent: #5E7BFF; --accent-press: #4C69EE; --on-accent: #FFFFFF; --panel: #171C33; --panel-ink: #A9B9FF; --accent-soft: rgba(94,123,255,.18);
  --good: #56C98B; --good-soft: rgba(86,201,139,.14); --bad: #F2846F; --bad-soft: rgba(242,132,111,.14); color-scheme: dark; }

html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.7 var(--font); margin: 0; }
* { box-sizing: border-box; }
button, a, label.tile { touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: .92em; }
b { font-weight: 600; }
[hidden] { display: none !important; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(170%) blur(16px); -webkit-backdrop-filter: saturate(170%) blur(16px); }
.bar-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.01em; margin-right: auto; }
.brand span { color: var(--muted); font: 500 13px var(--mono); margin-left: 6px; }
.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 4px; min-width: 250px; }
.seg button { position: relative; z-index: 1; height: 40px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--muted); transition: color 220ms ease; }
.seg button[aria-pressed="true"] { color: var(--on-accent); }
.seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--accent); transition: transform 300ms var(--ease-io); }
.seg[data-on="1"] .knob { transform: translateX(100%); }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); flex: none; }
.tabs { max-width: 820px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; height: 38px; padding: 0 15px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); background: var(--surface); white-space: nowrap; }
.tab i { font: normal 500 12px var(--mono); margin-right: 6px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

main { max-width: 820px; margin: 0 auto; padding: 18px 16px 140px; }

/* press feedback */
.btn, .tile, .tab, .chip, .iconbtn, .seg button, .cardrow, .num { transition: transform 140ms var(--ease), background-color 160ms ease, color 160ms ease, border-color 160ms ease, box-shadow 160ms ease; }
.btn:active, .tile:active, .tab:active, .chip:active, .iconbtn:active, .seg button:active, .cardrow:active, .num:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) {
  .iconbtn:hover { background: var(--surface); color: var(--ink); }
  .tile:hover { border-color: var(--muted); }
  .cardrow:hover { background: var(--surface); }
  .btn.primary:hover { background: var(--accent-press); }
}

.btn { height: 52px; padding: 0 24px; border-radius: 16px; font-weight: 600; font-size: 16px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 2px 0 var(--accent-press); }
.btn.light { background: var(--on-accent); color: #1D3A9E; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; box-shadow: none; }
.btn.small { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 12px; }
.btn.ghost { background: transparent; color: var(--muted); }

/* chapter cover */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 28px; padding: 28px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: center; overflow: hidden; }
.hero h1 { font-size: clamp(34px, 6vw, 48px); line-height: 1.08; letter-spacing: -.03em; margin: 0 0 10px; text-wrap: balance; }
.hero p { margin: 0 0 22px; opacity: .85; font-size: 16px; max-width: 34ch; }
.hero .meta { font: 500 13px var(--mono); opacity: .8; margin-bottom: 8px; }
.hero svg { width: 100%; height: auto; display: block; }
.hero .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.6s var(--ease) .15s forwards; }
.hero .draw.d2 { animation-delay: .45s; } .hero .draw.d3 { animation-delay: .75s; }
.hero .fadein { opacity: 0; animation: fade 600ms ease 1.1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
.prog-line { display: flex; align-items: center; gap: 10px; font: 500 13px var(--mono); opacity: .9; margin-bottom: 16px; }
.prog-line .track { flex: 1; height: 6px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; max-width: 180px; }
.prog-line .fill { height: 100%; background: var(--on-accent); border-radius: 99px; transform-origin: left; }
.cards { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 4px; }
.cardrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 12px; border-radius: 16px; }
.cardrow .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--mono); background: var(--surface); color: var(--muted); }
.cardrow.done .dot { background: var(--accent); color: var(--on-accent); }
.cardrow.next .dot { box-shadow: 0 0 0 2px var(--accent); color: var(--accent); background: var(--bg); }
.cardrow .t { font-weight: 600; font-size: 16px; line-height: 1.35; }
.cardrow .s { font-size: 14px; color: var(--muted); line-height: 1.45; }
.cardrow .go { color: var(--muted); font-size: 18px; }
.soon { margin-top: 26px; }
.soon h2 { font-size: 20px; margin: 0 0 8px; }
.soon ol { padding-left: 22px; color: var(--muted); margin: 0 0 18px; }

/* card player */
.player-top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.segs { flex: 1; display: grid; gap: 4px; }
.segs i { height: 6px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.segs i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 380ms var(--ease); }
.segs i.on::after { transform: scaleX(1); }
.pcount { font: 500 13px var(--mono); color: var(--muted); }
.card { animation: cardIn 340ms var(--ease) both; }
.card.back { animation-name: cardBack; }
@keyframes cardIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes cardBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.card h2 { font-size: 15px; font-weight: 600; color: var(--accent); margin: 0 0 6px; letter-spacing: 0; }
.card .key { font-size: clamp(23px, 4.2vw, 30px); line-height: 1.38; font-weight: 650; letter-spacing: -.015em; margin: 0 0 14px; text-wrap: pretty; max-width: 30ch; }
.card .key .mono { font-size: .86em; font-weight: 600; }
.card .body { color: var(--muted); font-size: 16.5px; max-width: 62ch; margin: 0 0 22px; }
.card .body b { color: var(--ink); }
.panel { background: var(--panel); border-radius: 24px; padding: 22px; margin: 0 0 22px; }
/* captions: big readable strip on a plain ground, key phrases marked */
.cap { margin-top: 14px; background: var(--bg); border-radius: 16px; padding: 14px 16px; font-size: 16.5px; line-height: 1.65; color: var(--ink); min-height: 54px; }
.cap.step { display: flex; gap: 12px; align-items: flex-start; }
.cap .ct { min-width: 0; }
.cap b { font-weight: 700; background: var(--accent-soft); border-radius: 6px; padding: 1px 5px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.cap b.yes { background: var(--good-soft); } .cap b.no { background: var(--bad-soft); }
.cap .ico { flex: none; width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: 600 13px var(--mono); display: grid; place-items: center; }
.cap .ico.fin { background: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 15px; font-weight: 500; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { flex: none; width: 16px; height: 16px; border-radius: 5px; background: var(--c); }
.legend i.ring { background: transparent; border: 3px solid var(--c); }
.legend i.ringd { background: transparent; border: 2px dashed var(--c); border-radius: 50%; }
.legend i.line { width: 24px; height: 5px; border-radius: 3px; }
.legend i.dash { width: 24px; height: 0; border-top: 3px dashed var(--c); background: none; border-radius: 0; }
.legend i.dot { border-radius: 50%; }
.stepbar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.stepbar .sb-back { width: 52px; padding: 0; }
.stepbar .count { margin-left: auto; font: 500 13px var(--mono); color: var(--panel-ink); }
.panel > .chips:first-child { margin-bottom: 14px; }
.sub { font-size: 14px; font-weight: 600; color: var(--panel-ink); margin-bottom: 2px; }
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cells.nowrap { flex-wrap: nowrap; }
.cl { position: relative; flex: none; min-width: 40px; height: 42px; padding: 0 8px; border-radius: 10px; background: var(--bg); display: inline-grid; place-items: center; font: 600 15px var(--mono); margin-top: 20px; transition: background-color 200ms ease, color 200ms ease; }
.cl small { position: absolute; top: -19px; left: -4px; right: -4px; text-align: center; font: 500 11px var(--mono); color: var(--panel-ink); white-space: nowrap; }
.cl.hi { background: var(--accent); color: var(--on-accent); }
.cl.ok { background: var(--good-soft); color: var(--good); }
.cl.bad { background: var(--bad-soft); color: var(--bad); }
.cl.ring, .cl.src { box-shadow: inset 0 0 0 3px var(--ink); }
.cl.empty { color: transparent; opacity: .55; }
.cl.gap { background: transparent; }
.cl.pat { background: var(--surface-2); }
.scrollx.sm .cl { min-width: 30px; width: 30px; height: 36px; padding: 0; font-size: 14px; }
.scrollx.sm .cells + .cells .cl { margin-top: 6px; }
.rows { display: grid; gap: 2px; }
.rw { display: grid; grid-template-columns: 40px 1fr; align-items: end; gap: 6px; }
.rl { font: 600 14px var(--mono); color: var(--panel-ink); padding-bottom: 11px; }
.duo2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.flip.three { grid-template-columns: repeat(3, 1fr); }
.flipc.grpA { box-shadow: inset 0 0 0 2.5px var(--accent); } .flipc.grpA small { color: var(--accent); }
.flipc.grpB { box-shadow: inset 0 0 0 2.5px var(--ink); } .flipc.grpB small { color: var(--ink); }
.mx { border-collapse: separate; border-spacing: 4px; width: auto; margin: 0 auto; }
.mx th { font: 600 13px var(--mono); color: var(--panel-ink); padding: 0 6px; text-align: center; border: 0; }
.mx th small { display: block; font-size: 10px; font-weight: 500; }
.mx td { min-width: 42px; height: 40px; text-align: center; background: var(--bg); border-radius: 9px; font: 600 15px var(--mono); border: 0; padding: 0 6px; transition: background-color 200ms ease; }
.mx td.k { background: var(--accent-soft); }
.mx td.ch { background: var(--accent); color: var(--on-accent); }
.mx th.kh { color: var(--accent); }
.grid { border-collapse: separate; border-spacing: 4px; margin: 0 auto; width: auto; }
.grid td { width: 50px; height: 50px; background: var(--bg); border-radius: 10px; text-align: center; position: relative; font: 600 15px var(--mono); border: 0; padding: 0; }
.grid td.row { background: var(--accent-soft); }
.grid td.path { background: var(--accent); color: var(--on-accent); }
.grid i.coin { position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; border-radius: 50%; background: #E8A33D; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
.split > div { min-width: 0; }
.hgrid { display: grid; grid-template-columns: repeat(13, minmax(46px, 1fr)); gap: 4px; min-width: 640px; }
.hcol { display: grid; gap: 4px; align-content: start; }
.hix { text-align: center; font: 600 12px var(--mono); color: var(--panel-ink); padding: 5px 0; border-radius: 8px; background: var(--bg); }
.hix.on { background: var(--accent); color: var(--on-accent); }
.hw { font: 600 11px var(--mono); text-align: center; padding: 7px 2px; border-radius: 8px; background: var(--bg); overflow-wrap: anywhere; }
.hw.hi { background: var(--accent); color: var(--on-accent); }
.hw.bad { background: var(--bad-soft); color: var(--bad); }
.elist { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.elist span { font: 500 13px var(--mono); padding: 6px 11px; border-radius: 99px; background: var(--bg); }
.elist span.ok { background: var(--accent); color: var(--on-accent); }
.elist span.rej { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.elist span.now { box-shadow: inset 0 0 0 2.5px var(--ink); }
.hq { display: flex; flex-wrap: wrap; gap: 8px; }
.hq span { display: grid; place-items: center; min-width: 70px; padding: 10px 12px; border-radius: 14px; background: var(--bg); font: 500 13px var(--mono); }
.hq b { font-size: 16px; background: none; }
.hq span.now { background: var(--accent); color: var(--on-accent); }
.coins { display: flex; gap: 10px; margin: 14px 0 4px; }
.cn { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 700 20px var(--mono); background: #E8A33D; color: #3A2600; animation: lineIn 300ms var(--ease) both; }
.cn.o { background: var(--accent); color: var(--on-accent); }
.cap50 { margin-top: 18px; }
.bar50 { display: flex; height: 46px; border-radius: 12px; background: var(--bg); overflow: hidden; }
.bar50 .seg { background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 600 14px var(--mono); border-right: 2px solid var(--panel); }
.axis50 { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--panel-ink); margin-top: 4px; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--font); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 40px; padding: 0 16px; border-radius: 999px; background: var(--bg); font-size: 14px; font-weight: 600; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* viz bits */
.grow { display: grid; gap: 8px; }
.grow .r { display: grid; grid-template-columns: 92px 1fr 118px; gap: 10px; align-items: center; font: 500 14px var(--mono); }
.grow .bar2 { height: 14px; border-radius: 99px; background: var(--accent); transform-origin: left; transition: transform 300ms var(--ease); }
.grow .r.x .bar2 { background: var(--bad); }
.grow .r .v { text-align: right; color: var(--muted); font-size: 13px; }
.grow .r.x { color: var(--bad); }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; }
.slider { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font: 600 15px var(--mono); }
.slider span, .slider b { white-space: nowrap; flex: none; }
.slider b { min-width: 2ch; }
.flip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.flipc { min-height: 86px; border-radius: 16px; background: var(--bg); padding: 12px 14px; text-align: left; font-size: 15px; line-height: 1.45; display: grid; align-content: space-between; gap: 8px; }
.flipc small { font: 600 12px var(--mono); color: var(--muted); }
.flipc.dec small { color: var(--good); } .flipc.opt small { color: var(--bad); }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tg { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px 0 14px; border-radius: 14px; background: var(--bg); font: 500 16px var(--mono); }
.tg b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; font-weight: 600; transition: background-color 180ms ease, color 180ms ease; }
.tg[data-v="1"] b { background: var(--good-soft); color: var(--good); }
.tg[data-v="0"] b { background: var(--bad-soft); color: var(--bad); }
.clauses { display: grid; gap: 6px; font: 15px var(--mono); }
.clauses div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-radius: 12px; background: var(--bg); }
.yes { color: var(--good); } .no { color: var(--bad); }
.combos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
.combo { height: 54px; border-radius: 12px; background: var(--bg); font: 500 14px var(--mono); display: grid; place-items: center; line-height: 1.2; transition: background-color 220ms ease, color 220ms ease; }
.combo small { font-size: 11px; color: var(--muted); }
.combo.ok { background: var(--good-soft); color: var(--good); } .combo.ok small { color: var(--good); }
.combo.ko small { color: var(--bad); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 14px var(--mono); }
.flow span { background: var(--bg); border-radius: 12px; padding: 10px 14px; }
.flow span.hot { background: var(--accent); color: var(--on-accent); }
.flow em { font-style: normal; color: var(--panel-ink); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > div { background: var(--bg); border-radius: 16px; padding: 14px 16px; min-width: 0; font-size: 15px; }
.duo h4 { margin: 0 0 6px; font-size: 14px; }
.duo ul { margin: 0; padding-left: 18px; }
.duo .mono { font-size: 13.5px; }
.tl { display: grid; gap: 10px; }
.tl div { display: grid; grid-template-columns: 64px 1fr; gap: 12px; background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.tl b { font-family: var(--mono); color: var(--accent); }
.cnf { font: 500 19px var(--mono); text-align: center; padding: 14px 0 10px; line-height: 2; }
.cnf span { border-radius: 8px; padding: 2px 3px; transition: background-color 200ms ease, color 200ms ease; }
.cnf span.hl { background: var(--accent); color: var(--on-accent); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--panel-ink); font-size: 13px; }
.vx { cursor: pointer; }
.vx circle { transition: fill 200ms ease, stroke 200ms ease; }

/* worked written answer */
.work { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.work .q { padding: 18px 20px; font-size: 16px; background: var(--surface); }
.work .q small { display: block; color: var(--muted); font-size: 13px; }
.work .paper { padding: 4px 20px 16px; }
.work ol { list-style: none; margin: 0; padding: 0; counter-reset: l; }
.work li { counter-increment: l; display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); animation: lineIn 320ms var(--ease) both; }
.work li::before { content: counter(l); font: 12px var(--mono); color: var(--muted); padding-top: 4px; }
.work li .t { font-size: 16px; overflow-wrap: anywhere; }
.work li .t.code { font: 14px/1.6 var(--mono); }

function mountWork(host, data, opts = {}) {
  const lines = data.lines;
  host.classList.add('work');
  host.innerHTML = (data.q ? `<div class="q"><small>ตัวอย่างข้อเขียน</small>${esc(data.q)}</div>` : '') +
    `<div class="paper"><ol></ol><div class="ctl"><button class="btn small primary nx">เขียนบรรทัดแรก</button><button class="btn small ghost all">แสดงทั้งหมด</button><button class="btn small ghost rs" hidden>เริ่มใหม่</button><span class="count"></span></div></div>`;
  const ol = $('ol', host), nx = $('.nx', host), all = $('.all', host), rs = $('.rs', host), cnt = $('.count', host);
  let shown = 0;
  const add = i => {
    const l = lines[i], li = document.createElement('li');
    li.innerHTML = `<div class="t${l.c || opts.code ? ' code' : ''}">${esc(l.t)}</div>` + (l.n ? `<div class="n">${esc(l.n)}</div>` : '');
    ol.appendChild(li);
  };
  const sync = () => {
    cnt.textContent = `${shown}/${lines.length}`;
    nx.textContent = shown ? 'บรรทัดถัดไป' : 'เขียนบรรทัดแรก';
    nx.disabled = all.disabled = shown >= lines.length;
    rs.hidden = !shown;
  };
  nx.onclick = () => { if (shown < lines.length) add(shown++); sync(); };
  all.onclick = () => { while (shown < lines.length) add(shown++); sync(); };
  rs.onclick = () => { ol.innerHTML = ''; shown = 0; sync(); };
  sync();
}

function mcq(item, shuffle) {
  const ord = shuffle ? Core.shuffle(item.c.map((_, i) => i)) : item.c.map((_, i) => i);
  return { type: 'mcq', ch: item.ch, q: item.q, c: ord.map(i => item.c[i]), a: ord.indexOf(item.a), why: item.why, pts: 1 };
}
function calc(spec) {
  const r = Core.solve(spec);
  return { type: 'calc', ch: spec.ch, spec, q: CALC_TEXT[spec.kind](spec).replace(/<span class="mono">/g, '<span class="data">'), fmt: CALC_FORMAT[spec.kind], answer: r.answer, lines: r.lines, keyNote: spec.keyNote, pts: 4 };
}
function buildPast() { return PAST.map(it => (it.kind ? calc(it) : mcq(it, false))); }
function buildRandom() {
  const okCh = it => quizCfg.ch === 'all' || it.ch === quizCfg.ch;
  const pool = [...PAST.filter(i => !i.kind), ...EXTRA].filter(okCh);
  const kinds = Object.keys(Core.gen).filter(k => okCh({ ch: Core.gen[k]().ch }));
  let m = [], c = [];
  const type = quizCfg.type === 'calc' && !kinds.length ? 'mcq' : quizCfg.type;
  if (type !== 'calc') m = Core.shuffle(pool).slice(0, type === 'mcq' ? 20 : 15).map(it => mcq(it, true));
  if (type !== 'mcq' && kinds.length) {
    const n = type === 'calc' ? 6 : 5, ks = [];
    while (ks.length < n) ks.push(...Core.shuffle(kinds));
    c = ks.slice(0, n).map(k => calc(Core.gen[k]()));
  }
  const all = Core.shuffle(m);
  c.forEach((q, i) => all.splice(Math.min(all.length, Math.round((i + 1) * all.length / (c.length + 1)) + i), 0, q));
  return all;
}

function ring(frac, size, stroke, color, track) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" style="transition:stroke-dashoffset 900ms var(--ease)"/></svg>`;
}

  <section class="builder"><h2>ชุดสุ่มใหม่</h2><p>ปรนัยสุ่มจากคลัง ข้อคำนวณสร้างโจทย์ใหม่ทุกครั้ง ทำซ้ำได้ไม่จำกัด</p>
    <div class="kinds">${Object.values(CALC_NAME).map(n => `<span>${n}</span>`).join('')}</div>
    <div class="grp"><div class="lbl">บท</div><div class="chips" id="f-ch">${chs.map(([k, l]) => `<button class="chip" aria-pressed="${quizCfg.ch === k}" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="grp"><div class="lbl">ชนิดข้อ</div><div class="chips" id="f-ty">${types.map(([k, l]) => `<button class="chip" aria-pressed="${quizCfg.type === k}" data-k="${k}">${l}</button>`).join('')}</div></div>
    <button class="btn primary wide" id="start-rand">สุ่มชุดใหม่</button></section>`;
  $$('#f-ch .chip').forEach(b => b.onclick = () => { quizCfg.ch = b.dataset.k; $$('#f-ch .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $$('#f-ty .chip').forEach(b => b.onclick = () => { quizCfg.type = b.dataset.k; $$('#f-ty .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#start-past').onclick = () => startRun('past');
  $('#start-rand').onclick = () => startRun('rand');
  setDock('');
}

function startRun(kind) {
  const qs = kind === 'past' ? buildPast() : buildRandom();
  run = { kind, qs, i: 0, ans: {}, res: {}, review: false };
  renderQ(); window.scrollTo({ top: 0 });
}
const runPts = () => run.qs.reduce((s, q, i) => s + (run.res[i] ? q.pts : 0), 0);

function renderQ() {
  closeSheet();
  const i = run.i, q = run.qs[i], checked = i in run.res;
  main.innerHTML = `<div class="qtop"><button class="iconbtn" id="qx" aria-label="ออกจากควิซ">✕</button><div class="qbar">${run.qs.map((_, j) => `<i class="${j in run.res ? (run.res[j] ? 'g' : 'b') : ''}"></i>`).join('')}</div><span class="qpts">${runPts()} คะแนน</span></div>
  <article class="qcard"><div class="qno">ข้อ ${i + 1} <span>/ ${run.qs.length}  ${q.pts} คะแนน</span></div><div class="qtext">${q.q}</div>${q.type === 'mcq'
    ? `<div class="tiles${checked ? ' locked' : ''}" role="radiogroup">${q.c.map((c, j) => `<label class="tile"><input type="radio" name="q" value="${j}"><span class="k">${'ABCD'[j]}</span><span>${c}</span><span class="mk"></span></label>`).join('')}</div>`
    : `<div class="ans"><div class="hint">${esc(q.fmt.hint)}</div><input id="qin" type="text" inputmode="${q.fmt.mode}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${esc(q.fmt.ph)}"></div>`}</article>`;
  $('#qx').onclick = () => { if (run.review) showResult(); else renderQuizHome(); };
  if (q.type === 'mcq') {
    $$('.tile', main).forEach((t, j) => { $('input', t).onchange = () => { if (i in run.res) return; run.ans[i] = j; $$('.tile', main).forEach((x, k) => x.classList.toggle('sel', k === j)); $('#check').disabled = false; }; });
  } else {
    const inp = $('#qin');
    inp.value = run.ans[i] || '';
    inp.oninput = () => { run.ans[i] = inp.value; $('#check').disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim() && !(i in run.res)) check(); };
  }
  if (checked) { paintChecked(); showSheet(); setDock(''); }
  else { setDock(`<button class="btn primary" id="check" disabled>ตรวจคำตอบ</button>`); $('#check').onclick = check; }
}

function check() {
  const i = run.i, q = run.qs[i];
  run.res[i] = q.type === 'mcq' ? run.ans[i] === q.a : Core.check(q.spec, run.ans[i], q.answer);
  if (document.activeElement) document.activeElement.blur();
  paintChecked(); setDock(''); showSheet();
  $$('.qbar i', main)[i].className = run.res[i] ? 'g' : 'b';
  $('.qpts', main).textContent = runPts() + ' คะแนน';
}

function paintChecked() {
  const i = run.i, q = run.qs[i];
  if (q.type === 'mcq') {
    $('.tiles', main).classList.add('locked');
    $$('.tile', main).forEach((t, j) => {
      $('input', t).disabled = true;
      if (j === q.a) { t.classList.add('right'); $('.mk', t).textContent = '✓'; }
      else if (j === run.ans[i]) { t.classList.add('wrong'); $('.mk', t).textContent = '✗'; }
    });
  } else { const inp = $('#qin'); inp.value = run.ans[i] || ''; inp.disabled = true; inp.classList.add(run.res[i] ? 'right' : 'wrong'); }
}

function showSheet() {
  const i = run.i, q = run.qs[i], ok = run.res[i], last = i === run.qs.length - 1;
  sheetIn.innerHTML = `<div class="verdict"><span class="badge">${ok ? '✓' : '✗'}</span>${ok ? 'ถูกต้อง' : 'ยังไม่ถูก'}<small>${ok ? '+' + q.pts : '0'}/${q.pts}</small></div>` +
    (q.type === 'mcq' ? (q.why ? `<p class="why">${esc(q.why)}</p>` : '') :
      `${ok ? '' : `<div class="right-ans"><small>คำตอบที่ถูกต้อง</small>${esc(q.answer)}</div>`}${q.keyNote ? `<p class="why" style="font-size:14px">${esc(q.keyNote)}</p>` : ''}<div id="sol"></div>`) +
    `<div class="acts">${run.review ? '<button class="btn" id="s-back">กลับหน้าสรุป</button>' : `<button class="btn primary" id="s-next">${last ? 'ดูคะแนน' : 'ข้อต่อไป'}</button>`}</div>`;
  if (q.type === 'calc') mountWork($('#sol', sheetIn), { lines: q.lines }, { code: true });
  sheet.classList.remove('good', 'bad'); sheet.classList.add(ok ? 'good' : 'bad');
  requestAnimationFrame(() => sheet.classList.add('open'));
  sheetIn.scrollTop = 0;
  if (run.review) $('#s-back').onclick = showResult;
  else $('#s-next').onclick = () => { if (last) showResult(); else { run.i++; renderQ(); window.scrollTo({ top: 0 }); } };
}

function showResult() {
  closeSheet(); run.review = true;
  const total = run.qs.reduce((s, q) => s + q.pts, 0), got = runPts();
  const mT = run.qs.filter(q => q.type === 'mcq').length, mG = run.qs.filter((q, i) => q.type === 'mcq' && run.res[i]).length;
  const cT = run.qs.filter(q => q.type === 'calc').length, cG = run.qs.filter((q, i) => q.type === 'calc' && run.res[i]).length;
  if (run.kind === 'past' && Object.keys(run.res).length === run.qs.length) { const b = store.get('best-past', null); if (b == null || got > b) store.set('best-past', got); }
  main.innerHTML = `<div class="qtop"><button class="iconbtn" id="qx" aria-label="ออกจากควิซ">✕</button><div class="qbar">${run.qs.map((_, j) => `<i class="${j in run.res ? (run.res[j] ? 'g' : 'b') : ''}"></i>`).join('')}</div><span class="qpts">${got} คะแนน</span></div>
  <section class="result"><div class="ring">${ring(0, 168, 14, 'var(--accent)', 'var(--surface-2)')}<div><b>${got}</b><small>จาก ${total} คะแนน</small></div></div><h1>${run.kind === 'past' ? 'ควิซที่ผ่านมา' : 'ชุดสุ่ม'}</h1><div class="split">${mT ? `ปรนัยถูก ${mG}/${mT} ข้อ` : ''}${mT && cT ? '   ' : ''}${cT ? `คำนวณถูก ${cG}/${cT} ข้อ` : ''}</div>
  <div class="lbl">แตะเลขข้อเพื่อดูเฉลยและวิธีทำ</div><div class="nums">${run.qs.map((_, j) => `<button class="num ${run.res[j] ? 'g' : 'b'}" data-j="${j}">${j + 1}</button>`).join('')}</div>
  <div class="acts"><button class="btn" id="again">ทำชุดนี้ใหม่</button><button class="btn primary" id="new">สุ่มชุดใหม่</button></div></section>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const c = $$('.result .ring circle', main)[1]; const C = +c.getAttribute('stroke-dasharray'); c.setAttribute('stroke-dashoffset', C * (1 - got / total)); }));
  $('#qx').onclick = renderQuizHome;
  $$('.num', main).forEach(b => b.onclick = () => { run.i = +b.dataset.j; renderQ(); window.scrollTo({ top: 0 }); });
  $('#again').onclick = () => { run = { ...run, i: 0, ans: {}, res: {}, review: false }; renderQ(); };
  $('#new').onclick = () => startRun('rand');
  setDock(''); window.scrollTo({ top: 0 });
}

/* ---------- mode + theme ---------- */
function setMode(m) {
  state.mode = m; store.set('mode', m); state.card = null;
  $('#seg').dataset.on = m === 'quiz' ? 1 : 0;
  $('#m-learn').setAttribute('aria-pressed', m === 'learn');
  $('#m-quiz').setAttribute('aria-pressed', m === 'quiz');
  renderTabs();
  if (m === 'quiz') renderQuizHome(); else renderCover();
  window.scrollTo({ top: 0 });
}
$('#m-learn').onclick = () => setMode('learn');
$('#m-quiz').onclick = () => setMode('quiz');
const root = document.documentElement, savedTheme = store.get('theme', null);
if (savedTheme) root.dataset.theme = savedTheme;
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
};
setMode(state.mode);
})();
</script>
